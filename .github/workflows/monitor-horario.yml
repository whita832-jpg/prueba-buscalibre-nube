name: Monitor BuscaLibre — historial y alertas

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - '.github/workflows/monitor-horario.yml'

permissions:
  contents: write

concurrency:
  group: buscalibre-hourly-monitor
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio e historial
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Probar reglas de precios y géneros
        run: python monitor.py --self-test

      - name: Revisar catálogos solo tapa dura (acceso directo y respaldo)
        id: scan
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPINGANT_API_TOKEN: ${{ secrets.SCRAPINGANT_API_TOKEN }}
        run: python monitor.py --mode monitor --source auto --parallel 1

      - name: Guardar historial y estado de cobertura en GitHub
        if: always()
        run: |
          if [ -f estado_monitor_v7.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado_monitor_v7.json
            if ! git diff --cached --quiet; then
              git commit -m "Actualización automática de precios y cobertura [skip ci]"
              # El repositorio puede haber avanzado durante el escaneo.
              # Reconciliar cambios sin sobrescribir historial ni código.
              for intento in 1 2 3; do
                git fetch origin main
                git rebase origin/main
                if git push origin HEAD:main; then
                  echo "Historial conservado en GitHub."
                  break
                fi
                if [ "$intento" -eq 3 ]; then
                  echo "::error::No se pudo persistir el historial."
                  exit 1
                fi
                sleep 3
              done
            else
              echo "El historial no ha cambiado."
            fi
          else
            echo "::error::No se creó el archivo de estado."
            exit 1
          fi

      - name: Guardar reporte y candidatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-buscalibre-${{ github.run_number }}
          path: |
            reporte_integral_v7.txt
            estado_monitor_v7.json
            todos_los_libros_v7.csv
            candidatos_menos_200_v7.csv
            verificacion_candidatos_v7.csv
            ofertas_confirmadas_v7.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Marcar fallo si falta cobertura
        if: steps.scan.outcome != 'success'
        run: |
          echo "::error::Revisión incompleta o error. Consultar el reporte."
          exit 1
