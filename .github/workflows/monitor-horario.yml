name: Monitor BuscaLibre — historial y alertas

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    paths:
      - '.github/workflows/monitor-horario.yml'
      - 'monitor-pulso.txt'

permissions:
  contents: write

concurrency:
  group: buscalibre-hourly-monitor
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio e historial
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Actualizar rama e historial antes del escaneo
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Probar reglas de precios y géneros
        run: |
          python monitor.py --self-test
          python fusionar_estado.py --self-test

      - name: Revisar tapa dura verificada en los cuatro catálogos
        id: scan
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPINGANT_API_TOKEN: ${{ secrets.SCRAPINGANT_API_TOKEN }}
        run: |
          # BuscaLibre puede devolver fichas duplicadas entre páginas por un
          # cambio temporal de su paginación. No dar por completa la cobertura:
          # repetir la revisión entera antes de declarar fallo.
          for intento in 1 2 3; do
            echo "Revisión BuscaLibre: intento ${intento}/3"
            if python monitor.py --mode monitor --source auto --parallel 1; then
              echo "Cobertura completa verificada en el intento ${intento}."
              exit 0
            fi
            echo "::warning::Revisión incompleta en intento ${intento}/3."
            if [ "${intento}" -lt 3 ]; then
              sleep 15
            fi
          done
          if [ -f reporte_integral_v7.txt ]; then
            echo "Diagnóstico de la última revisión:"
            grep -E '^(EDITORIAL:|  Páginas fallidas:|  ERROR:)' reporte_integral_v7.txt || true
          fi
          echo "::error::Cobertura incompleta tras 3 intentos completos."
          exit 1

      - name: Guardar historial y estado de cobertura en GitHub
        if: always()
        shell: bash
        run: |
          if [ ! -f estado_monitor_v7.json ]; then
            echo "::error::No se creó el archivo de estado."
            exit 1
          fi
          cp estado_monitor_v7.json "$RUNNER_TEMP/estado-local.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          guardado=false
          for intento in 1 2 3; do
            # Nunca rebasar un commit que edita el mismo JSON: puede tener
            # conflictos incluso con dos ejecuciones exitosas consecutivas.
            git fetch origin main
            git reset --hard origin/main
            python fusionar_estado.py --incoming "$RUNNER_TEMP/estado-local.json" --target estado_monitor_v7.json
            git add estado_monitor_v7.json
            if git diff --cached --quiet; then
              echo "El estado ya está guardado sin diferencias."
              guardado=true
              break
            fi
            git commit -m "Actualización automática de precios y cobertura [skip ci]"
            if git push origin HEAD:main; then
              echo "Historial fusionado y conservado en GitHub."
              guardado=true
              break
            fi
            echo "::warning::El remoto avanzó durante el escaneo. Reintentando fusión."
            sleep 3
          done
          if [ "$guardado" != "true" ]; then
            echo "::error::No se pudo persistir el historial tras tres intentos."
            exit 1
          fi

      - name: Guardar reporte y candidatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-buscalibre-${{ github.run_number }}
          path: |
            reporte_integral_v7.txt
            estado_monitor_v7.json
            todos_los_libros_v7.csv
            candidatos_menos_200_v7.csv
            verificacion_candidatos_v7.csv
            ofertas_confirmadas_v7.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Marcar fallo si falta cobertura
        if: steps.scan.outcome != 'success'
        run: |
          echo "::error::Revisión incompleta o error. Consultar el reporte."
          exit 1
